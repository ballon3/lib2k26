[project]
name = "lib2k26"
version = "0.1.0"
description = "Lightning in a Bottle 2026"
readme = "README.md"
authors = [
    { name = "Ryan Brown", email = "ryan@mimetics.io" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "uvicorn>=0.35.0",
]

[project.scripts]
lib2k26 = "airtable_ops_automation.cli:main"
lib2k26-api = "airtable_ops_automation.run_api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/airtable_ops_automation"]
